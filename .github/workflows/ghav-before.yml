name: "ghav before: CI"
"on":
  push:
    branches:
      - ghav/dev/1147
    paths:
      - .ghav/before
permissions:
  contents: read
env:
  DSH_TELEMETRY_DISABLED: "1"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: "'true' == 'false'"
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: "'true' == 'true'"
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        if: "'true' == 'true'"
        with:
          node-version: 22.23.2
      - if: "'true' == 'true'"
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: "'true' == 'true'"
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: "'true' == 'true'"
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: "'true' == 'true'"
        run: yarn install --immutable
      - name: Temporarily skip AA profile smoke in CI
        if: "'true' == 'true'"
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          for (const workspace of ['dsh-plugin-desktop', 'dsh-plugin-desktop-beta']) {
            const path = `${workspace}/package.json`
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            const smoke = ' && yarn run verify:aa'
            if (!manifest.scripts.check.includes(smoke)) throw new Error(`AA check not found in ${workspace}`)
            manifest.scripts.check = manifest.scripts.check.replace(smoke, '')
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE
      - if: "'true' == 'true'"
        run: yarn check
      - name: Install Chromium for Next window regression
        if: "'true' == 'true'"
        run: yarn workspace dsh-desktop-next exec playwright install --with-deps chromium
      - name: Verify Next window controls in the official frontend
        if: "'true' == 'true'"
        run: yarn workspace dsh-desktop-next verify:window-controls
      - name: Verify Next Profile onboarding without a Host
        if: "'true' == 'true'"
        run: yarn workspace dsh-desktop-next verify:onboarding
      - name: Verify Next native protocol mutations in Electron
        if: "'true' == 'true'"
        run: xvfb-run --auto-servernum yarn workspace dsh-desktop-next verify:protocol --no-sandbox
      - name: Verify Next native sidebar Browser in Electron
        if: "'true' == 'true'"
        run: xvfb-run --auto-servernum yarn workspace dsh-desktop-next verify:sidebar-browser --no-sandbox
  desktop-linux:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - dsh-plugin-desktop
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:linux-package
      - name: Build Linux AppImage and Debian package
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: "1"
        run: yarn workspace ${{ matrix.workspace }} dist:linux
